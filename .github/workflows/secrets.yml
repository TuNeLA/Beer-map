# Secret scan on every push to main / big-update: gitleaks (default rules, full history) + JWT role check.
name: secrets
on:
  push:
    branches: [main, big-update]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: "gitleaks (redacted output)"
        run: |
          curl -sSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar xzf gl.tgz gitleaks
          ./gitleaks git --redact --no-banner -c .gitleaks.toml .
      - name: "JWT roles: only anon keys allowed"
        run: python3 scripts/check-jwt-roles.py .
