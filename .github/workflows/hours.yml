name: Hours (OpenStreetMap)

# ⏰ docs/hours.json (bars, club ages, 🌭 nattmat) + 🍾 docs/systembolaget.json from Overpass. Own workflow, so a slow
# Overpass can never cost the bars.json commit of "Bars (OpenStreetMap)".
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch-hours.mjs'
      - 'scripts/oh-parse.mjs'
      - 'scripts/placeinfo.mjs'
      - 'scripts/overture-se.py'
      - '.github/workflows/hours.yml'
  schedule:
    - cron: '47 4 * * 1'   # every Monday 04:47 UTC (after the bars run)

permissions:
  contents: write

concurrency:
  group: hours
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # pack (A6): after the switch (PAGES_DEPLOY = actions) the data lives on branch `data`, not on main. Start from it.
      - name: Newest data from branch data (only when PAGES_DEPLOY = actions)
        if: ${{ vars.PAGES_DEPLOY == 'actions' }}
        run: bash scripts/pack/data-overlay.sh

      - name: Overture Maps (Systembolaget stores OSM lacks; optional)
        continue-on-error: true
        timeout-minutes: 10
        run: pip install --quiet duckdb==2.0.0 && python3 scripts/overture-se.py /tmp/overture-se.json

      - name: Fetch opening hours from Overpass
        env:
          OVERTURE_JSON: /tmp/overture-se.json
        run: node scripts/fetch-hours.mjs

      - name: Commit docs/hours.json and docs/systembolaget.json if changed
        env:
          PAGES_DEPLOY: ${{ vars.PAGES_DEPLOY }}
        run: |
          # pack (A6): PAGES_DEPLOY = actions = commit to branch `data` (scripts/pack/data-push.sh), never to main.
          # The deploy (pages-bundle.yml) starts from this run's end and reads `data`. Unset = the old commit to main below.
          if [ "$PAGES_DEPLOY" = actions ]; then
            bash scripts/pack/data-push.sh "Update hours.json and systembolaget.json from OpenStreetMap [skip ci]" docs/hours.json docs/systembolaget.json
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/hours.json docs/systembolaget.json
          if git diff --cached --quiet; then
            echo "hours unchanged"
            exit 0
          fi
          git commit -m "Update hours.json and systembolaget.json from OpenStreetMap [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
