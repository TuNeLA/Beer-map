# Gives the service worker a new cache version on every app change,
# so every phone gets the full new version (never a mix of old and new files).
name: Stamp app version
on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stamp-version
  cancel-in-progress: false
jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hash app files and stamp sw.js
        run: |
          # index.html is left out of the hash: it is stamped below, and HTML is always fetched fresh.
          HASH=$(find docs -type f ! -name sw.js ! -name index.html ! -name bars.json ! -name places.json -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-10)
          sed -i -E "s/^var VERSION = \"[^\"]*\";/var VERSION = \"olnu-$HASH\";/" docs/sw.js
          # Give every local script and the stylesheet a ?v=HASH so a new page can never run with old cached code.
          sed -i -E "s#(src=\"\./[^\"?]+\.js)(\?v=[A-Za-z0-9]+)?\"#\1?v=$HASH\"#g; s#(href=\"\./styles\.css)(\?v=[A-Za-z0-9]+)?\"#\1?v=$HASH\"#g" docs/index.html
          grep -n '?v=' docs/index.html | head -3
          grep -n '^var VERSION' docs/sw.js
          if git diff --quiet; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Stamp app version $HASH [skip ci]"
          git pull --rebase
          git push
