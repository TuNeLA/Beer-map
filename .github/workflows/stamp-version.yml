# Gives the service worker a new cache version on every app change,
# so every phone gets the full new version (never a mix of old and new files).
name: Stamp app version
on:
  push:
    branches: [main]
    paths: ["docs/**", "scripts/stamp.mjs"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stamp-version
  cancel-in-progress: false
jobs:
  stamp:
    # A1: only while the site deploys from the branch. Release day: repo variable PAGES_DEPLOY = actions (stamping then happens in
    # pages-bundle.yml on a copy; the repo stays clean, no bot commits).
    if: ${{ vars.PAGES_DEPLOY != 'actions' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: "Stamp docs/ (scripts/stamp.mjs: ?v=<file hash> on every local js/css + sw.js VERSION)"
        run: |
          # A1: the same stamper as the bundled build and the beta. Data (bars.json, places.json, places/, buildings/) is not in the site hash:
          # the weekly data update must not make every phone download the whole app again.
          node scripts/stamp.mjs docs --write
          HASH=$(grep -oE '^var VERSION = "olnu-[0-9a-f]{10}' docs/sw.js | grep -oE '[0-9a-f]{10}$')
          grep -n '^var VERSION' docs/sw.js
          if git diff --quiet; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Stamp app version $HASH [skip ci]"
          git pull --rebase
          git push
