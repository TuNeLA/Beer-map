# The guards: unit tests, quality gate, split guard, stamp guard, shard guard, migration rules. No browser, about 1 minute.
# ONE copy, called from two places (ci1):
#   tests.yml        on every push to big-update / ci/** and on a PR to main
#   pages-bundle.yml the live deploy: the deploy job needs these jobs (no green guards = no deploy)
# Run the same checks on your machine: bash scripts/dev/quick.sh   (no test names = guards only)
name: guards

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: quality (size, structure, duplicates, UI rules; baseline only shrinks)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node tests/quality/check.mjs .   # CODE QUALITY GUARD layer 1: writes tests/quality/report.json, prints a 10-line summary
      - name: upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: tests/quality/report.json
          retention-days: 14
          overwrite: true

  unit:
    name: unit (tests, split, stamp, shards, migrations)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # W2 split guard: verify.mjs needs the pre-w2 base commit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund   # playwright (npm ci downloads no browser), esbuild, acorn: versions from package-lock.json
      - run: node tests/e2e/notif-sw-test.js .
      - run: node scripts/import-sport.test.mjs
      - run: node tests/e2e/local-lines-test.js docs/js   # LIVE ticker: Ludvika-area lines only near Ludvika
      - run: node --test "tests/unit/*.test.mjs"   # w1-tests: pure logic the app.js split moves (U.n1, kaos, poll plan, bundleChunks, crowdSort, ticker) + plan / build-site
      - name: "workflow YAML is valid (a bad file never runs and fails silently)"
        run: python3 -c "import glob,yaml; [yaml.safe_load(open(f)) for f in glob.glob('.github/workflows/*.yml')]; print('workflows ok')"
      - name: "every e2e test file parses (a syntax error fails a whole shard with 0 tests)"
        run: for f in tests/e2e/*.js tests/e2e/*.mjs scripts/ci/*.mjs scripts/*.mjs; do [ -f "$f" ] || continue; node --check "$f" || { echo "syntax error in $f"; exit 1; }; done
      - name: "no .ci-only file outside ci/ lane branches (big-update, main, a PR: it would cut the run)"
        run: |
          case "${{ github.ref }}" in refs/heads/ci/*) exit 0 ;; esac
          if [ -f .ci-only ]; then echo ".ci-only must not be merged (ref ${{ github.ref }})"; exit 1; fi
      - name: "shard guard (A1: every tests/e2e/*-pw.js runs in exactly one CI shard, or is on tests/e2e/not-in-ci.txt with a reason)"
        run: node scripts/ci/shard-guard.mjs .
      - name: split guard (structure on every push; move-only proof only for a "W2 step" commit)
        run: bash scripts/split/ci.sh "${{ github.event.before }}"
      - name: stamp guard (A1 no ?v= in the repo + stamp.mjs and the bundle build work, A17 SRI + exact CSP)
        env:
          PAGES_DEPLOY: ${{ vars.PAGES_DEPLOY }}   # = actions after release day: the repo must be clean (no ?v=, VERSION "dev")
        run: node scripts/ci/stamp-guard.mjs docs
      - name: rpc_bundle2 client names are on the server list (A10)
        run: node scripts/ci/bundle-allow.mjs .
      - name: Migration rules (A3 no new anchor patch, CR-safe helpers, additive, in release/order.txt)
        run: node scripts/ci/no-anchor-patch.mjs .
