name: Bars (OpenStreetMap)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch-bars.mjs'
      - 'scripts/fetch-places.mjs'
      - '.github/workflows/bars.yml'
  schedule:
    - cron: '17 4 * * 1'   # every Monday 04:17 UTC

permissions:
  contents: write

concurrency:
  group: bars
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch bars from Overpass
        run: node scripts/fetch-bars.mjs

      - name: Fetch restaurant names from Overpass
        # Optional: if this fails, the app falls back to bar names and towns.
        # Own time limit, so a slow Overpass cannot use up the job time and lose the bars.json commit.
        continue-on-error: true
        timeout-minutes: 12
        run: node scripts/fetch-places.mjs

      - name: Commit docs/bars.json and docs/places.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/bars.json
          if [ -f docs/places.json ]; then git add docs/places.json; fi
          if [ -d docs/places ]; then git add docs/places; fi
          if git diff --cached --quiet; then
            echo "bars.json and places.json unchanged"
            exit 0
          fi
          git commit -m "Update bars.json and places.json from OpenStreetMap [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
