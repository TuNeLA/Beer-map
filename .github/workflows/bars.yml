name: Bars (OpenStreetMap)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch-bars.mjs'
      - '.github/workflows/bars.yml'
  schedule:
    - cron: '17 4 * * 1'   # every Monday 04:17 UTC

permissions:
  contents: write

concurrency:
  group: bars
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch bars from Overpass
        run: node scripts/fetch-bars.mjs

      - name: Commit docs/bars.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/bars.json
          if git diff --cached --quiet; then
            echo "bars.json unchanged"
            exit 0
          fi
          git commit -m "Update bars.json from OpenStreetMap [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
