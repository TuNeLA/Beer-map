name: tests

# Gating tests: guards (unit, quality, split, stamp, shards), UI e2e (mocked Supabase, no live writes) and a schema load test.
# ci1: the jobs live in two reusable files, so the live deploy (pages-bundle.yml) runs the SAME guards and the SAME gate shards:
#   guards.yml  unit + quality (about 1 min, no browser)
#   e2e.yml     the Playwright shards. The list is tests/e2e/shards.txt (one line per shard), not this file.
#               Shards with `site=bundled` test the built site (scripts/build-site.mjs): they replace the old "bundle" job.
# Speed (code audit B1): browser cache, 2 tests at once per shard (PAR), 20 balanced shards = one wave of runners,
#   a push with only docs / ops files starts no e2e runner. A new push cancels the older run only on ci/ branches.
# Map tests need the secret MAPBOX_TEST_TOKEN. Without it they are skipped (not failed).
# Live-server tests (beta-pw.js) never run here.

on:
  push:
    branches: [big-update, 'ci/**']   # ci/<agent>-<n>: agents test their copies here (tests/e2e/CI-FOR-AGENTS.md)
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One finished run per commit on big-update (the release gate reads the run of a commit): there the group holds the commit,
# so no run is cancelled and none waits behind another (a waiting run of the same group would be dropped by a newer push).
# Only a ci/ lane branch keeps one group per branch: a new push cancels the run of its older commit.
concurrency:
  group: tests-${{ github.ref }}-${{ startsWith(github.ref, 'refs/heads/ci/') && 'lane' || github.sha }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/ci/') }}

jobs:
  guards:
    uses: ./.github/workflows/guards.yml

  e2e:
    uses: ./.github/workflows/e2e.yml
    secrets: inherit   # MAPBOX_TEST_TOKEN

  schema:
    name: schema loads (supabase/schema -> empty Postgres 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGURL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build bundle (schema + fake auth stub + seed)
        run: node supabase/staging/apply.mjs --local-stub --seed --out /tmp/apply.sql
      - name: Apply in one transaction
        run: psql "$PGURL" -X -q -v ON_ERROR_STOP=1 -1 -f /tmp/apply.sql
      - name: Counts must equal supabase/schema/counts.json
        run: |
          psql "$PGURL" -X -At -f supabase/staging/verify.sql > /tmp/verify.json
          cat /tmp/verify.json
          node -e '
            const v = JSON.parse(require("fs").readFileSync("/tmp/verify.json","utf8"));
            const c = require("./supabase/schema/counts.json").catalog_counts;
            const keys = ["tables","functions","sequences","views","indexes","triggers","constraints","rls_tables","policies","secdef_functions"];
            const bad = keys.filter(k => Number(v[k]) !== Number(c[k]));
            if (bad.length) { console.error("MISMATCH", bad.map(k => k + ": live " + c[k] + " vs loaded " + v[k])); process.exit(1); }
            console.log("all counts match");'
      - name: Smoke test core RPCs as a seeded user
        run: |
          psql "$PGURL" -X -At -v ON_ERROR_STOP=1 -f supabase/staging/smoke.sql | tee /tmp/smoke.txt
          if grep -E '^[a-z0-9_]+\|f\|' /tmp/smoke.txt; then echo "smoke check failed"; exit 1; fi
      # w1-server (A3, CR-LF, A10): rules and tools in supabase/README.md
      - name: Snapshot md5 = live md5 of every function (A3)
        run: node scripts/ci/schema-md5.mjs load -d "$PGURL"
      - name: Fingerprint = supabase/schema/fingerprint.json (A3; prints only until W0 commits the file)
        run: node scripts/ci/schema-md5.mjs fingerprint -d "$PGURL" --keys functions_md5,columns_md5,constraints_md5,indexes_md5,triggers_md5,views_md5
      - name: Release rehearsal, LF and CR LF, two times (supabase/release/order.txt)
        env: { PGHOST: 127.0.0.1, PGPORT: '5432', PGUSER: postgres, PGPASSWORD: postgres }
        run: node scripts/ci/sql-rehearsal.mjs --twice --pre 0500
      - name: Anchor helpers with CR LF anchors (supabase/tests/crlf-anchors.test.sql)
        env: { PGHOST: 127.0.0.1, PGPORT: '5432', PGUSER: postgres, PGPASSWORD: postgres }
        run: |
          psql -d rh_crlf -X -v ON_ERROR_STOP=1 -f supabase/tests/crlf-anchors.test.sql | tee /tmp/crlf.txt
          if grep -q '|f|' /tmp/crlf.txt || ! grep -q '^crlf-anchors total|t|' /tmp/crlf.txt; then echo "CR LF anchor test failed"; exit 1; fi
      - name: 0500 rpc_bundle_allow (same rpc_bundle2 answers)
        env: { PGHOST: 127.0.0.1, PGPORT: '5432', PGUSER: postgres, PGPASSWORD: postgres }
        run: |
          psql -d rh_pre -X -v ON_ERROR_STOP=1 -v mig=supabase/migrations/0500_rpc_bundle_allow.sql -f supabase/tests/rpc-bundle-allow-0500.test.sql | tee /tmp/b0500.txt
          if grep -q '|f|' /tmp/b0500.txt || ! grep -q '^new_row_bundles|t|' /tmp/b0500.txt; then echo "0500 test failed"; exit 1; fi
      - name: 0510 security (a block really hides, group code IP limit, server age gate)
        env: { PGHOST: 127.0.0.1, PGPORT: '5432', PGUSER: postgres, PGPASSWORD: postgres }
        run: |
          psql -d rh_lf -X -v ON_ERROR_STOP=1 -v mig=supabase/migrations/0510_security_audit.sql -f supabase/tests/security-0510.test.sql | tee /tmp/s0510.txt
          if grep -q '|f|' /tmp/s0510.txt || ! grep -q '^age: under-18 cannot join a group|t|' /tmp/s0510.txt; then echo "0510 test failed"; exit 1; fi
      - name: 0509 Skåla med telefonen matcher (supabase/tests/bump-0509.test.sql)
        env: { PGHOST: 127.0.0.1, PGPORT: '5432', PGUSER: postgres, PGPASSWORD: postgres }
        run: |
          psql -d rh_lf -X -v ON_ERROR_STOP=1 -v mig=supabase/migrations/0509_bump_cheers.sql -f supabase/tests/bump-0509.test.sql | tee /tmp/b0509.txt
          if grep -q '|f|' /tmp/b0509.txt || ! grep -q '^bump-0509 done|t|' /tmp/b0509.txt; then echo "0509 test failed"; exit 1; fi
      - name: 0517-0523 srv1 security + server fixes (check-in proof, pin ids, owner key, join codes, medals, timeout, cool-down)
        env: { PGHOST: 127.0.0.1, PGPORT: '5432', PGUSER: postgres, PGPASSWORD: postgres }
        run: |
          for t in "0517_checkin_verify checkin-0517" "0518_old_pin_ids pins-0518" "0519_owner_key_lockout ownerkey-0519" "0520_join_code_limit joincode-0520" "0521_medal_claims medals-0521" "0522_role_timeout timeout-0522" "0523_cooldown_setting cooldown-0523" "0524_shared_groups sharedgroups-0524"; do
            set -- $t
            psql -d rh_lf -X -v ON_ERROR_STOP=1 -v mig=supabase/migrations/$1.sql -f supabase/tests/$2.test.sql | tee /tmp/srv1-$2.txt
            if grep -q '|f|' /tmp/srv1-$2.txt || ! grep -q "^$2 done|t|" /tmp/srv1-$2.txt; then echo "$2 test failed"; exit 1; fi
          done
      - name: Staging drift report (optional secret STAGING_DB_URL, read-only; warn only)
        continue-on-error: true
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          if [ -z "$STAGING_DB_URL" ]; then echo "no STAGING_DB_URL secret: skipped"; exit 0; fi
          node scripts/ci/schema-md5.mjs diff --url-env STAGING_DB_URL
          node scripts/ci/schema-md5.mjs fingerprint --url-env STAGING_DB_URL
