name: tests

# Gating tests: UI e2e (mocked Supabase, no live writes), unit tests, and a schema load test.
# Map tests need the secret MAPBOX_TEST_TOKEN. Without it they are skipped (not failed).
# Supabase target: staging (pintsnow-staging). tests/e2e/serve.py rewrites the served config.js; run-all.sh checks it.
# Live-server tests (beta-pw.js) never run here.

on:
  push:
    branches: [big-update, 'ci/**']   # ci/<agent>-<n>: agents test their copies here (tests/e2e/CI-FOR-AGENTS.md)
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      TZ: Europe/Stockholm   # tests were written for Swedish time (nights, "ikväll"); UTC breaks some
    strategy:
      fail-fast: false
      matrix:
        include:
          # one shard = one runner (~1 min setup). Keep each shard under ~10 min, a failed test runs twice.
          - name: ui-1
            filter: '^(ux3|social2|strip|av2-wizard)$'
          - name: ui-2
            filter: '^(feat|nf|notif|autoci)$'
          - name: ui-3
            filter: '^(cam|ntf)$'
          - name: ui-4
            filter: '^(evx|safe|ds|ds-layout|notif-sw)$'
          - name: ui-5
            filter: '^(ds-sheet)$'
          - name: ui-6
            filter: '^(rpc-cover)$'
          - name: fxm
            filter: '^(fxm)$'
          - name: fxg
            filter: '^(fxg)$'
          - name: pf
            filter: '^(pf)$'
          - name: lg
            filter: '^(lg)$'
          - name: cln
            filter: '^(cln)$'
          - name: dm
            filter: '^(dm)$'
          - name: dialekt
            filter: '^(dialekt|dialekt-packs)$'
          - name: games2
            filter: '^(games2)$'
          - name: txtfit
            filter: '^(txtfit)$'
          - name: ds-motion
            filter: '^(ds-motion)$'
          - name: gw
            filter: '^(gw)$'
          - name: inst
            filter: '^(inst)$'
          - name: ui1
            filter: '^(ui1)$'
          - name: social-b
            filter: '^(social-b)$'
          - name: social-a
            filter: '^(social-a)$'
          - name: after
            filter: '^(after2|moments)$'
          - name: misc
            filter: '^(misc)$'
          - name: ride
            filter: '^(ride|ride3)$'
          - name: main
            filter: '^(main|sec)$'
          - name: x8
            filter: '^(x8)$'
          - name: followups
            filter: '^(followups)$'
          - name: fixs
            filter: '^(fixs)$'
          - name: fixj
            filter: '^(fixj)$'
          - name: fixc
            filter: '^(fixc)$'
          - name: perf
            filter: '^(perf)$'
          - name: perfchat
            filter: '^(perfchat)$'
          - name: fixm
            filter: '^(fixm)$'
          - name: heat
            filter: '^(heat)$'
          - name: fixmo
            filter: '^(fixmo)$'
          - name: left
            filter: '^(left)$'
          - name: kpi
            filter: '^(kpi)$'
          - name: ownerfix
            filter: '^(ownerfix)$'
          - name: popfix
            filter: '^(popfix)$'
          - name: hooks-order
            filter: '^(hooks-order)$'
          - name: a4rel
            filter: '^(a4rel)$'
          - name: placesearch
            filter: '^(placesearch)$'
          - name: icons
            filter: '^(icons)$'
          - name: a2ui
            filter: '^(a2ui)$'
          - name: b1people
            filter: '^(b1people)$'
          - name: webkit
            filter: '^(ds-motion-wk|ds-layout-wk)$'
            browsers: chromium webkit
          - name: map-1
            filter: '^(glmap|tiers2)$'
          - name: map-2
            filter: '^(tiers3|map4|barzoom)$'
          - name: map-3
            filter: '^(glfix-avpins|zones|mbx)$'
          - name: map-lane
            filter: '^(map)$'
          - name: map-ui1
            filter: '^(ui1-map|ownerfix-map)$'
          - name: mapzoom
            filter: '^(mapzoom)$'
          - name: systemet
            filter: '^(systemet)$'
    steps:
      - uses: actions/checkout@v4
      - name: "lane filter: a .ci-only file on a ci/ branch lists the shards to run (one name per line)"
        id: only
        run: if [ -f .ci-only ] && ! grep -qx "${{ matrix.name }}" .ci-only; then echo "skip=1" >> "$GITHUB_OUTPUT"; echo "skipped by .ci-only"; fi
      - uses: actions/setup-node@v4
        if: steps.only.outputs.skip != '1'
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
        if: steps.only.outputs.skip != '1'
      - name: Install Playwright browsers
        if: steps.only.outputs.skip != '1'
        run: npx playwright install --with-deps ${{ matrix.browsers || 'chromium' }}
      - name: Serve docs/ on port 8793 (map) and 8871 (UI), Supabase target = staging
        if: steps.only.outputs.skip != '1'
        env:
          PN_TARGET: staging   # serve.py serves config.js pointed at pintsnow-staging (the file in git is not changed)
        run: |
          nohup python3 tests/e2e/serve.py 8793 docs > /tmp/http-8793.log 2>&1 &
          nohup python3 tests/e2e/serve.py 8871 docs > /tmp/http-8871.log 2>&1 &
          for p in 8793 8871; do
            for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:$p/index.html && break; sleep 1; done
          done
      - name: Restore last run's flaky list (flake gate)
        if: steps.only.outputs.skip != '1'
        uses: actions/cache/restore@v4
        with:
          path: tests/e2e/out/flaky-prev
          key: flaky-${{ matrix.name }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: flaky-${{ matrix.name }}-${{ github.ref_name }}-
      - name: Run tests
        if: steps.only.outputs.skip != '1'
        env:
          MAPBOX_TEST_TOKEN: ${{ secrets.MAPBOX_TEST_TOKEN }}   # real Mapbox for the map tests (matrix "map"); empty = skipped
          PN_TARGET: staging   # run-all.sh stops if the served config.js does not point at this target
          TO: '900'
          FLAKE_GATE: '1'   # a test that passes only on the rerun in 2 runs in a row = FAIL (tests/e2e/flakes.json)
        run: bash tests/e2e/run-all.sh 8793 8871 '${{ matrix.filter }}'
      - name: Upload logs
        if: ${{ (always()) && steps.only.outputs.skip != '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ matrix.name }}
          path: |
            tests/e2e/out/logs/
            tests/e2e/out/traces/
            tests/e2e/out/ui1-shots/
            tests/e2e/out/social-b-shots/
          retention-days: 14
          if-no-files-found: warn
      - name: Keep this run's flaky list for the next run
        if: ${{ (always()) && steps.only.outputs.skip != '1' }}
        run: mkdir -p tests/e2e/out/flaky-prev && cp tests/e2e/out/logs/flaky-now.txt tests/e2e/out/flaky-prev/ 2>/dev/null || true
      - name: Save flaky list
        if: ${{ (always()) && steps.only.outputs.skip != '1' }}
        uses: actions/cache/save@v4
        with:
          path: tests/e2e/out/flaky-prev
          key: flaky-${{ matrix.name }}-${{ github.ref_name }}-${{ github.run_id }}

  # left T-25: the bundled Pages build (scripts/bundle.mjs, pages-bundle.yml) must work like docs/: build it, smoke test it
  # against the plain site (modules, styles, lazy files, part errors, unbundle fallback, service worker offline), then run
  # e2e tests on the bundled copy (same mocks).
  bundle:
    name: bundle (bundled Pages build = docs/)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TZ: Europe/Stockholm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund esbuild@0.24.0 acorn@8.12.1
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build + smoke test the bundle, e2e tests on the bundled site
        env:
          PN_TARGET: staging
          TO: '900'
        run: bash scripts/bundle-check.sh . 8875 8871 '^(sec|ux3|social2|dialekt|fixs|left|perf)$'
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-bundle
          path: tests/e2e/out/bundle/logs/
          retention-days: 14
          if-no-files-found: warn

  quality:
    name: quality (size, structure, duplicates, UI rules; baseline only shrinks)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund acorn@8.12.1
      - run: node tests/quality/check.mjs .   # CODE QUALITY GUARD layer 1: writes tests/quality/report.json, prints a 10-line summary
      - name: upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: tests/quality/report.json
          retention-days: 14

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # W2 split guard: verify.mjs needs the pre-w2 base commit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/e2e/notif-sw-test.js .
      - run: node scripts/import-sport.test.mjs
      - run: node tests/e2e/local-lines-test.js docs/js   # LIVE ticker: Ludvika-area lines only near Ludvika
      - run: node --test "tests/unit/*.test.mjs"   # w1-tests: pure logic the app.js split moves (U.n1, kaos, poll plan, bundleChunks, crowdSort, ticker)
      - name: "workflow YAML is valid (a bad file never runs and fails silently)"
        run: python3 -c "import glob,yaml; [yaml.safe_load(open(f)) for f in glob.glob('.github/workflows/*.yml')]; print('workflows ok')"
      - name: "no .ci-only file on big-update or main (it is only for ci/ lane branches)"
        run: if [ -f .ci-only ] && { [ "${{ github.ref }}" = refs/heads/big-update ] || [ "${{ github.ref }}" = refs/heads/main ]; }; then echo ".ci-only must not be merged"; exit 1; fi
      - name: split guard (structure on every push; move-only proof only for a "W2 step" commit)
        run: |
          npm install --no-save --no-audit --no-fund acorn@8.12.1
          bash scripts/split/ci.sh "${{ github.event.before }}"
      - name: stamp guard (A1 no ?v= in the repo + stamp.mjs works, A17 SRI + exact CSP)
        env:
          PAGES_DEPLOY: ${{ vars.PAGES_DEPLOY }}   # = actions after release day: the repo must be clean (no ?v=, VERSION "dev")
        run: |
          npm install --no-save --no-audit --no-fund esbuild@0.24.0 acorn@8.12.1
          node scripts/ci/stamp-guard.mjs docs
      - name: rpc_bundle2 client names are on the server list (A10)
        run: node scripts/ci/bundle-allow.mjs .
      - name: Migration rules (A3 no new anchor patch, CR-safe helpers, additive, in release/order.txt)
        run: node scripts/ci/no-anchor-patch.mjs .

  schema:
    name: schema loads (supabase/schema -> empty Postgres 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGURL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build bundle (schema + fake auth stub + seed)
        run: node supabase/staging/apply.mjs --local-stub --seed --out /tmp/apply.sql
      - name: Apply in one transaction
        run: psql "$PGURL" -X -q -v ON_ERROR_STOP=1 -1 -f /tmp/apply.sql
      - name: Counts must equal supabase/schema/counts.json
        run: |
          psql "$PGURL" -X -At -f supabase/staging/verify.sql > /tmp/verify.json
          cat /tmp/verify.json
          node -e '
            const v = JSON.parse(require("fs").readFileSync("/tmp/verify.json","utf8"));
            const c = require("./supabase/schema/counts.json").catalog_counts;
            const keys = ["tables","functions","sequences","views","indexes","triggers","constraints","rls_tables","policies","secdef_functions"];
            const bad = keys.filter(k => Number(v[k]) !== Number(c[k]));
            if (bad.length) { console.error("MISMATCH", bad.map(k => k + ": live " + c[k] + " vs loaded " + v[k])); process.exit(1); }
            console.log("all counts match");'
      - name: Smoke test core RPCs as a seeded user
        run: |
          psql "$PGURL" -X -At -v ON_ERROR_STOP=1 -f supabase/staging/smoke.sql | tee /tmp/smoke.txt
          if grep -E '^[a-z0-9_]+\|f\|' /tmp/smoke.txt; then echo "smoke check failed"; exit 1; fi
      # w1-server (A3, CR-LF, A10): rules and tools in supabase/README.md
      - name: Snapshot md5 = live md5 of every function (A3)
        run: node scripts/ci/schema-md5.mjs load -d "$PGURL"
      - name: Fingerprint = supabase/schema/fingerprint.json (A3; prints only until W0 commits the file)
        run: node scripts/ci/schema-md5.mjs fingerprint -d "$PGURL" --keys functions_md5,columns_md5,constraints_md5,indexes_md5,triggers_md5,views_md5
      - name: Release rehearsal, LF and CR LF, two times (supabase/release/order.txt)
        env: { PGHOST: 127.0.0.1, PGPORT: '5432', PGUSER: postgres, PGPASSWORD: postgres }
        run: node scripts/ci/sql-rehearsal.mjs --twice --pre 0500
      - name: Anchor helpers with CR LF anchors (supabase/tests/crlf-anchors.test.sql)
        env: { PGHOST: 127.0.0.1, PGPORT: '5432', PGUSER: postgres, PGPASSWORD: postgres }
        run: |
          psql -d rh_crlf -X -v ON_ERROR_STOP=1 -f supabase/tests/crlf-anchors.test.sql | tee /tmp/crlf.txt
          if grep -q '|f|' /tmp/crlf.txt || ! grep -q '^crlf-anchors total|t|' /tmp/crlf.txt; then echo "CR LF anchor test failed"; exit 1; fi
      - name: 0500 rpc_bundle_allow (same rpc_bundle2 answers)
        env: { PGHOST: 127.0.0.1, PGPORT: '5432', PGUSER: postgres, PGPASSWORD: postgres }
        run: |
          psql -d rh_pre -X -v ON_ERROR_STOP=1 -v mig=supabase/migrations/0500_rpc_bundle_allow.sql -f supabase/tests/rpc-bundle-allow-0500.test.sql | tee /tmp/b0500.txt
          if grep -q '|f|' /tmp/b0500.txt || ! grep -q '^new_row_bundles|t|' /tmp/b0500.txt; then echo "0500 test failed"; exit 1; fi
      - name: Staging drift report (optional secret STAGING_DB_URL, read-only; warn only)
        continue-on-error: true
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          if [ -z "$STAGING_DB_URL" ]; then echo "no STAGING_DB_URL secret: skipped"; exit 0; fi
          node scripts/ci/schema-md5.mjs diff --url-env STAGING_DB_URL
          node scripts/ci/schema-md5.mjs fingerprint --url-env STAGING_DB_URL
