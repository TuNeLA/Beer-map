<div class="ticker hud-panel" role="marquee" aria-live="off">

</div>
<div id="chaos" class="chaos" role="status" hidden>

</div>
<div id="rally" class="rally hud-panel" role="status" hidden></div>
<div class="hud-left">
  <div id="my-streak" class="my-streak" hidden></div>
  <div id="hud-x" class="hud-x" hidden></div>
</div>
<button id="btn-heat" class="map-chip" type="button" aria-pressed="false" hidden>🔥 Värme</button>
<button id="btn-ghostpins" class="map-chip ghost-chip" type="button" aria-pressed="false" hidden>👻 Förra veckan</button>

<div id="attrib-pop" class="attrib-pop" role="note" hidden></div>
<button id="btn-taxi" class="locate-btn taxi-btn" type="button" aria-label="Taxi" title="Taxi"><span aria-hidden="true">🚕</span></button>

<div id="offline-banner" class="offline-banner" role="status" hidden><span id="offline-text">Du är offline.</span></div>

<div id="install-banner" class="banner" hidden>
  <span id="install-text"></span>
  <button id="install-go" class="btn btn-small btn-amber" type="button" hidden></button>
  <button id="install-close" class="icon-btn icon-btn-small" type="button" aria-label="Stäng">✕</button>
</div>

<div class="dock">
  <div class="dock-top">
    <button id="btn-stop" class="btn btn-small btn-ghost stop-btn" type="button" hidden></button>
  </div>
  <div class="dock-row">
    <button id="btn-groups" class="side-btn" type="button">
      <span class="side-ico" aria-hidden="true">👥</span>
      <span id="groups-label" class="side-label"></span>
      <span id="groups-badge" class="badge-green" hidden></span>
    </button>
    <div class="beer-wrap">
      <svg class="cd-svg" viewBox="0 0 124 124" aria-hidden="true">
        <circle class="cd-track" cx="62" cy="62" r="56"/>
        <circle id="cd-ring" class="cd-ring" cx="62" cy="62" r="56"/>
      </svg>
      <button id="btn-beer" class="beer-btn" type="button"><span id="beer-label" class="beer-label">ÖL!</span><span id="beer-sub" class="beer-sub"></span></button>
      <div id="other-wrap" class="other-wrap" hidden>
        <svg class="ocd-svg" viewBox="0 0 60 60" aria-hidden="true">
          <circle class="ocd-track" cx="30" cy="30" r="27"/>

        </svg>
        <button id="btn-other" class="other-btn" type="button"><span id="other-label" class="other-label">🥃 ANNAT</span></button>
      </div>
    </div>
    <div class="prec">
      <div class="seg" role="radiogroup" id="prec-seg">
        <button type="button" role="radio" data-prec="exact" id="prec-exact"></button>
        <button type="button" role="radio" data-prec="area" id="prec-area"></button>
      </div>
    </div>
  </div>
  <div id="prec-hint" class="prec-hint"></div>
</div>

<div id="backdrop" class="backdrop" hidden></div>
<section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>

  <div class="sheet-head">
    <h2 id="sheet-title"></h2>
    <button id="sheet-close" class="icon-btn" type="button" aria-label="Stäng">✕</button>
  </div>
  <div id="sheet-body" class="sheet-body"></div>
</section>

<div id="toasts" class="toasts" aria-live="assertive"></div>

<div id="intro" class="intro" role="dialog" aria-modal="true" aria-label="Öl Nu" hidden>
