<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Öl Nu</title>
<meta name="description" content="Live ölkarta över Sverige.">
<meta name="theme-color" content="#0a0f1c">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Öl Nu">

<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" href="./icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Chakra+Petch:wght@400;600;700&family=Share+Tech+Mono&display=swap">

<body>
<div id="map" aria-label="Karta"></div>
<div class="hud-overlay" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <span class="brand-name">Öl Nu</span>
    <span id="soon-chip" class="chip chip-soon" hidden>Snart</span>
  </div>
  <div id="live-count" class="live-count" aria-live="polite">🍺 –</div>
  <button id="btn-top" class="icon-btn" type="button" aria-label="Topplista ikväll">🏆</button>
  <button id="btn-settings" class="icon-btn" type="button" aria-label="Inställningar" data-i18n-aria="settings">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Zm7.4-2.5.1-1-.1-1 2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3h-4l-.4 2.6c-.6.3-1.2.6-1.7 1l-2.5-1-2 3.5L6.5 11l-.1 1 .1 1-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1L11 21h4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5-2.2-1.6Z"/></svg>
  </button>
</header>
<div class="ticker hud-panel" role="marquee" aria-live="off">
  <span class="tk-live" id="tk-live">LIVE</span>
  <div class="tk-viewport"><div id="ticker-track" class="tk-track"></div></div>
</div>
<div id="chaos" class="chaos" role="status" hidden>
  <div class="chaos-txt"><span id="chaos-head" class="chaos-head"></span><span id="chaos-facts" class="chaos-facts"></span></div>
  <button id="chaos-show" class="chaos-show" type="button">Visa</button>
  <button id="chaos-close" class="chaos-x" type="button" aria-label="Dölj kaos-larmet">✕</button>
</div>
<div id="rally" class="rally hud-panel" role="status" hidden></div>
<div class="hud-left">
  <div id="my-streak" class="my-streak" hidden></div>
  <div id="hud-x" class="hud-x" hidden></div>
</div>
<button id="btn-heat" class="map-chip" type="button" aria-pressed="false" hidden>🔥 Värme</button>
<button id="btn-ghostpins" class="map-chip ghost-chip" type="button" aria-pressed="false" hidden>👻 Förra veckan</button>
<button id="btn-attrib" class="attrib-btn" type="button" aria-label="Kartkällor" title="Kartkällor" aria-expanded="false" aria-controls="attrib-pop"><span aria-hidden="true">i</span></button>
<div id="attrib-pop" class="attrib-pop" role="note" hidden></div>
<button id="btn-locate" class="locate-btn" type="button" aria-label="Visa var jag är"><span aria-hidden="true">📍</span></button>
<div id="offline-banner" class="offline-banner" role="status" hidden><span id="offline-text">Du är offline.</span></div>

<div id="install-banner" class="banner" hidden>
  <span id="install-text"></span>
  <button id="install-go" class="btn btn-small btn-amber" type="button" hidden></button>
  <button id="install-close" class="icon-btn icon-btn-small" type="button" aria-label="Stäng">✕</button>
</div>

<div class="dock">
  <div class="dock-top">
    <button id="btn-stop" class="btn btn-small btn-ghost stop-btn" type="button" hidden></button>
  </div>
  <div class="dock-row">
    <button id="btn-groups" class="side-btn" type="button">
      <span class="side-ico" aria-hidden="true">👥</span>
      <span id="groups-label" class="side-label"></span>
      <span id="groups-badge" class="badge-green" hidden></span>
    </button>
    <div class="beer-wrap">
      <svg class="cd-svg" viewBox="0 0 124 124" aria-hidden="true">
        <circle class="cd-track" cx="62" cy="62" r="56"/>
        <circle id="cd-ring" class="cd-ring" cx="62" cy="62" r="56"/>
      </svg>
      <button id="btn-beer" class="beer-btn" type="button"><span id="beer-label" class="beer-label">ÖL!</span><span id="beer-sub" class="beer-sub"></span></button>
      <div id="other-wrap" class="other-wrap" hidden>
        <svg class="ocd-svg" viewBox="0 0 60 60" aria-hidden="true">
          <circle class="ocd-track" cx="30" cy="30" r="27"/>
          <circle id="ocd-ring" class="ocd-ring" cx="30" cy="30" r="27"/>
        </svg>
        <button id="btn-other" class="other-btn" type="button"><span id="other-label" class="other-label">🥃 ANNAT</span></button>
      </div>
    </div>
    <div class="prec">
      <div class="seg" role="radiogroup" id="prec-seg">
        <button type="button" role="radio" data-prec="exact" id="prec-exact"></button>
        <button type="button" role="radio" data-prec="area" id="prec-area"></button>
      </div>
    </div>
  </div>
  <div id="prec-hint" class="prec-hint"></div>
</div>

<div id="backdrop" class="backdrop" hidden></div>
<section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="sheet-grip" aria-hidden="true"></div>
  <div class="sheet-head">
    <h2 id="sheet-title"></h2>
    <button id="sheet-close" class="icon-btn" type="button" aria-label="Stäng">✕</button>
  </div>
  <div id="sheet-body" class="sheet-body"></div>
</section>

<div id="toasts" class="toasts" aria-live="assertive"></div>

<div id="intro" class="intro" role="dialog" aria-modal="true" aria-label="Öl Nu" hidden>
  <div id="intro-body" class="intro-card hud-panel"></div>
</div>

<script src="./js/social.js?v=d0bc8947b6"></script>

<script src="./js/taxi-data.js?v=d0bc8947b6"></script>
<script src="./js/extras.js?v=d0bc8947b6"></script>
<script src="./js/rally.js?v=d0bc8947b6"></script>
<script src="./js/barsplus.js?v=d0bc8947b6"></script>
<script src="./js/v14.js?v=d0bc8947b6"></script>
<script src="./js/games-content.js?v=d0bc8947b6"></script>
<script src="./js/games.js?v=d0bc8947b6"></script>
<script src="./js/after-content.js?v=d0bc8947b6"></script>
<script src="./js/after.js?v=d0bc8947b6"></script>
<script src="./js/boards.js?v=d0bc8947b6"></script>
<script src="./js/levels-content.js?v=d0bc8947b6"></script>
<script src="./js/news-gt.js?v=d0bc8947b6"></script>
<script src="./app.js?v=d0bc8947b6"></script>
</body>
