<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="script-src 'self' https://cdn.jsdelivr.net; object-src 'none'; base-uri 'self'; worker-src 'self' blob:">
<title>Öl Nu 3D-karta (demo)</title>
<!-- Phase 2 demo, NOT linked from the app: Mapbox GL JS v3 + Standard (night), pitch 60, 3D buildings, Ludvika.
     Shows what a full switch away from Leaflet could look like. One page open = one Mapbox map load. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mapbox-gl@3.32.0/dist/mapbox-gl.css">
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./polish.css">
<style>
  html,body{margin:0;height:100%;background:#0a0f1c}
  #m3{position:fixed;inset:0}
  .k3-tag{position:fixed;z-index:5;left:12px;top:calc(env(safe-area-inset-top,0px) + 12px);padding:6px 10px;border-radius:10px;
    background:rgba(10,15,28,.82);border:1px solid rgba(245,166,35,.45);color:#ffc24d;font:700 13px/1.3 "Chakra Petch",system-ui,sans-serif}
  .k3-mk{width:0;height:0;position:relative}
  .k3-mk .k3-name{position:absolute;left:0;top:18px;transform:translateX(-50%);white-space:nowrap;color:#ece6d6;
    font:700 12px/1 "Chakra Petch",system-ui,sans-serif;text-shadow:0 1px 3px #000,0 0 6px #000}
</style>
</head>
<body>
<div id="m3"></div>
<div class="k3-tag">🍺 Öl Nu · 3D-demo (fas 2, beta)</div>
<script defer src="./config.js"></script>
<script defer src="./js/util.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/mapbox-gl@3.32.0/dist/mapbox-gl.js"></script>
<script defer src="./js/karta3d.js"></script>
</body>
</html>
