<script>
/* GitHub Pages 404 page (source /docs). Old links .../Beer-map/docs/<page> arrive as /docs/<page>: go to /<page>,
   keep ?query and #hash (#pn= / #flytt= move codes too). Anything else: a link to the app. */
(function () {
  var p = location.pathname;
  if (/^\/docs(\/|$)/.test(p)) location.replace((p.replace(/^\/docs/, "") || "/") + location.search + location.hash);
})();
</script>
